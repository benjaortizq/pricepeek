{% load site_i18n %}
<footer class="w-full bg-surface-container-low border-t border-outline-variant/30 mt-space-xl{% if user.is_authenticated and user.role == 'client' %} mb-20 md:mb-0{% endif %}">
  <div class="w-full max-w-7xl mx-auto py-space-lg px-margin md:px-margin-desktop flex flex-col sm:flex-row items-center gap-2 sm:gap-4 text-center sm:text-left">
    <span class="text-headline-md font-headline-md font-extrabold text-on-surface">PricePeek</span>
    <span class="text-body-sm font-body-sm text-secondary">© {% now "Y" %} PricePeek Costa Rica. {% t 'Plataforma imparcial de comparación de precios.' %}</span>
    <a class="text-body-sm font-body-sm text-secondary underline underline-offset-4 hover:text-on-surface" href="{% url 'privacidad' %}">{% t 'Política de privacidad' %}</a>
  </div>
</footer>
