{# Tarjeta de un producto (como las de "Mejores ofertas" del diseño). Recibe: producto #}
<article class="bg-surface-container-lowest border border-outline-variant/60 hover:border-on-surface rounded-2xl overflow-hidden flex flex-col transition-colors">
  <a class="relative aspect-square bg-surface-container-lowest flex items-center justify-center p-5 border-b border-outline-variant/40" href="{% url 'detalle_producto' producto.pk %}">
    {% if producto.imagen_url %}
      <img src="{{ producto.imagen_url }}" alt="{{ producto.name }}" class="max-h-full max-w-full object-contain" loading="lazy">
    {% else %}
      <span class="material-symbols-outlined text-[48px] text-secondary">image_not_supported</span>
    {% endif %}
  </a>
  <div class="p-4 flex flex-col gap-1 flex-grow">
    <p class="text-label-badge font-label-badge uppercase tracking-wider text-secondary">{{ producto.brand.name }}</p>
    <a class="text-body-lg font-body-lg font-bold text-on-surface leading-snug hover:underline" href="{% url 'detalle_producto' producto.pk %}">{{ producto.name }}</a>
    <div class="mt-auto pt-3">
      {# TODO: mostrar el precio más bajo y su tienda. #}
      <p class="text-body-sm font-body-sm text-secondary">ola juan </p>
    </div>
  </div>
</article>
